          shutil.copy2(os.path.join(plugin, "hooks/hooks-cursor.json"),
                       os.path.join(root, "hooks/hooks-cursor.json"))
          PY
          cd "$project"
          HOME="$cursorhome" bun "$clone/graph-powers/bin/graph-powers.mjs" \
