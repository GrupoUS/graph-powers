name: CI

# A defect here reaches every project that installs the plugin, at once. These gates are cheap
# because the repository is markdown, JSON, standard-library Python and dependency-free ESM —
# there is no build to break.
on:
  push:
    branches: [main]
  pull_request:

# `check_workflows.mjs` executes the scripts in `workflows/` to dry-run them — that is the gate, not
# an accident — so a pull request adding a file there runs its code on the runner. GitHub already
# withholds secrets and forces a read-only token for a fork's `pull_request`, but a branch inside
# this repository gets whatever the repository default grants. Naming the permission caps that.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate compares this commit against the one before it. A depth-1 checkout
          # has nothing to compare against and the gate would skip itself, silently.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency for the frontmatter gate
        run: pip install --quiet pyyaml

      - name: Hook syntax
        run: python3 -c "import ast,glob;[ast.parse(open(f).read()) for f in glob.glob('hooks/*.py')]"

      - name: Workflow syntax
        # `node --check` refuses these files: they use a top-level `return`, legal only because the
        # runtime wraps the body. The script wraps them the same way, and also asserts that each
        # meta.name matches its filename — a mismatch registers the workflow under a name nobody
        # calls, and nothing else would notice.
        run: node .github/check_workflows.mjs

      - name: Valid JSON everywhere
        # glob() skips hidden directories, so .claude-plugin/*.json needs its own pattern —
        # without it the two manifests were never validated.
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(set(glob.glob("**/*.json", recursive=True) + glob.glob(".*/*.json")))
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print("\n".join(bad) or f"{len(files)} JSON files parse")
          sys.exit(1 if bad else 0)
          PY

      - name: A shipped change bumps the version
        run: python3 .github/check_version_bump.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Guardrails — negative tests, both harnesses
        run: python3 hooks/test_hooks.py

      - name: Frontmatter parses, and name matches the file
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          import yaml

          bad = []
          checked = 0

          def frontmatter(path):
              m = re.match(r"^---\n(.*?)\n---\n", open(path, encoding="utf-8").read(), re.S)
              if not m:
                  bad.append(f"{path}: no frontmatter")
                  return None
              try:
                  return yaml.safe_load(m.group(1))
              except Exception as e:
                  # Four command files once shipped an unquoted description containing ": ".
                  # They did not parse as YAML at all, and nothing noticed.
                  bad.append(f"{path}: invalid YAML -> {str(e).splitlines()[0]}")
                  return None

          for path in sorted(glob.glob("agents/*.md")):
              fm = frontmatter(path)
              checked += 1
              if not fm:
                  continue
              expected = os.path.basename(path)[:-3]
              if fm.get("name") != expected:
                  bad.append(f"{path}: name '{fm.get('name')}' != filename '{expected}'")
              if not fm.get("description"):
                  bad.append(f"{path}: no description")

          for path in sorted(glob.glob("skills/*/SKILL.md")):
              fm = frontmatter(path)
              checked += 1
              if not fm:
                  continue
              expected = os.path.basename(os.path.dirname(path))
              if fm.get("name") != expected:
                  bad.append(f"{path}: name '{fm.get('name')}' != directory '{expected}'")
              if not fm.get("description"):
                  bad.append(f"{path}: no description")

          for path in sorted(glob.glob("commands/*.md")):
              fm = frontmatter(path)
              checked += 1
              if fm and not fm.get("description"):
                  bad.append(f"{path}: no description")

          print("\n".join(bad) or f"{checked} artefacts OK")
          sys.exit(1 if bad else 0)
          PY
        env:
          PYTHONIOENCODING: utf-8

      - name: No machine paths
        # Inline no longer: three copies of this pattern existed — here, in AGENTS.md and in
        # CONTRIBUTING.md — and the moment one was corrected the other two were wrong. One script,
        # cited by the other two. It also states which paths it deliberately lets through.
        run: python3 .github/check_machine_paths.py

      - name: No broken symlinks
        run: |
          broken=$(find . -path ./.git -prune -o -type l ! -exec test -e {} \; -print 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "$broken"
            echo "::error::broken symlink — it lands in every clone and breaks any tree walk"
            exit 1
          fi
          echo "no broken symlinks"

      - name: Every declared hook exists, on both harnesses
        run: |
          python3 - <<'PY'
          import json, os, sys
          plugin = json.load(open(".claude-plugin/plugin.json"))
          d = json.load(open("hooks/hooks.json"))
          assert "hooks" not in plugin, "plugin.json duplicates the canonical hooks/hooks.json"
          commands = [h["command"] for arr in d.get("hooks", {}).values()
                      for m in arr for h in m["hooks"]]
          assert len(commands) == 14, f"expected 14 native hook registrations, found {len(commands)}"
          assert len(set(commands)) == 13, \
              f"expected 13 scripts with the Bash approver registered twice, found {len(set(commands))}"
          missing = [
              h["command"].split("/hooks/")[1].rstrip('"')
              for arr in d.get("hooks", {}).values() for m in arr for h in m["hooks"]
              if not os.path.exists("hooks/" + h["command"].split("/hooks/")[1].rstrip('"'))
          ]
          print("\n".join(f"MISSING: {m}" for m in missing)
                or "14 native registrations cover 13 hook scripts; every target exists")
          sys.exit(1 if missing else 0)
          PY

      - name: Every placeholder is a declared config key
        run: python3 .github/check_placeholders.py

      - name: Nothing POSIX-only in what an agent executes
        # The plugin installs on Linux, macOS and Windows. Every pattern this catches was a
        # live defect here, and none of them raised — they returned the wrong answer quietly.
        run: python3 .github/check_portability.py

      - name: The skill listing stays inside its budget
        # Claude Code loads every skill and command description into context at session start and
        # matches the user's sentence against that listing. The budget is about 1% of the context
        # window and it is shared with every other plugin on the machine — on overflow, Claude Code
        # drops descriptions silently, starting with the least-invoked entries, so a skill goes on
        # being listed while it stops being reachable. Three of this plugin's own skills were
        # measured in that state. Growth here is therefore paid by somebody else's skill.
        run: python3 .github/check_listing_budget.py

      - name: No command grew its floor without saying so
        # The other budget. `check_listing_budget.py` measures what the plugin costs before
        # anything is invoked; this measures what one command costs the moment it is. It shipped
        # with no ceiling and no step here, while `AGENTS.md` and `.claude/rules/verify-
        # supplements.md` both listed it among the gates that pass before anything ships — a line
        # that read as coverage for a script that could not fail.
        run: python3 .github/check_context_budget.py

      - name: Every routing reference resolves
        # The path gate below checks files. This one checks the routing: the agent a command
        # spawns, the workflow it invokes, the skill it loads, the section of another file it
        # tells the reader to apply. Those break silently — the model reads the instruction,
        # finds nothing, and continues with less than it thinks it has. Ten of them were live
        # in this repository while CI was green.
        run: python3 .github/check_wiring.py

      - name: No dangling file references
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          pat = re.compile(
              r'(?<![\w${./-])(?:references?|scripts|hooks|schema|templates|agents|commands|skills|codex|workflows)'
              r'/[A-Za-z0-9._/-]+\.(?:md|py|json|mjs|js|txt)'
          )
          missing = {}
          # A changelog is a record of what happened, not a description of what exists. It names
          # files this repository has since deleted, and files it never owned — `agents/codex-
          # rescue.md` belongs to the codex plugin, and the entry describing it is correct prose
          # that this gate has no way to tell from a broken link. Holding a history to today's
          # tree means the history can never mention a removal, which is most of what a changelog
          # is for.
          for f in glob.glob("**/*.md", recursive=True):
              if os.path.basename(f) == "CHANGELOG.md":
                  continue
              base = os.path.dirname(f)
              for m in set(pat.findall(open(f, encoding="utf-8", errors="replace").read())):
                  candidates = (m, os.path.join(base, m), os.path.join(base, "..", m),
                                os.path.join(base, "../..", m))
                  if any(os.path.exists(p) for p in candidates):
                      continue
                  missing.setdefault(m, []).append(f)
          for m, files in sorted(missing.items()):
              print(f"DANGLING: {m}  <- {', '.join(sorted(set(files))[:3])}")
          sys.exit(1 if missing else 0)
          PY

  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Codex artefacts, both scopes, install and removal
        # Two scopes, because they are two code paths and only one of them is the default.
        # `HOME` is redirected at the fixture: the global half writes into the Codex home, and a
        # test that let it write into the runner's real home would prove nothing about isolation
        # and would leak between steps.
        run: |
          fixture=$(mktemp -d)
          fakehome=$(mktemp -d)
          git -C "$fixture" init -q
          mkdir -p "$fixture/.codex" "$fakehome/.codex" "$fakehome/.agents/skills/someone-else"
          third='{"hooks":{"PreToolUse":[{"matcher":"*","hooks":[{"type":"command","command":"node /other/tool.mjs"}]}]}}'
          printf '%s\n' "$third" > "$fixture/.codex/hooks.json"
          printf '%s\n' "$third" > "$fakehome/.codex/hooks.json"
          echo "keep me" > "$fakehome/.agents/skills/someone-else/SKILL.md"

          echo "── project scope ──"
          node codex/install.mjs --project "$fixture" --plugin "$PWD" --scope project > /dev/null
          node codex/install.mjs --project "$fixture" --plugin "$PWD" --scope project > /dev/null
          python3 .github/check_codex.py "$fixture" "$fixture" project

          echo "── user scope (the default) ──"
          HOME="$fakehome" node codex/install.mjs --project "$fixture" --plugin "$PWD" > /dev/null
          HOME="$fakehome" node codex/install.mjs --project "$fixture" --plugin "$PWD" --force > /dev/null
          python3 .github/check_codex.py "$fakehome" "$fixture" user
          test -f "$fakehome/.agents/skills/someone-else/SKILL.md" || {
            echo "::error::a third party's skill was destroyed by the install"; exit 1; }

          echo "── removal ──"
          HOME="$fakehome" node codex/install.mjs --project "$fixture" --plugin "$PWD" --uninstall > /dev/null
          python3 - "$fakehome" "$fixture" <<'PY'
          import json, os, sys
          home, fixture = sys.argv[1], sys.argv[2]
          hooks = json.load(open(os.path.join(home, ".codex/hooks.json")))
          commands = [h["command"] for groups in hooks["hooks"].values()
                      for g in groups for h in g["hooks"]]
          assert commands == ["node /other/tool.mjs"], f"uninstall left {commands}"
          assert os.path.exists(os.path.join(home, ".agents/skills/someone-else/SKILL.md")), \
              "uninstall deleted a third party's skill"
          text = open(os.path.join(fixture, "AGENTS.md"), encoding="utf-8").read()
          assert "graph-powers" not in text, "uninstall left the AGENTS.md block behind"
          # Rules are copied as a starting point and then edited by the project. Removing them
          # would delete the line somebody added after an incident.
          assert os.path.isdir(os.path.join(fixture, ".codex/rules")), \
              "uninstall deleted the project's adapted rules"
          print("uninstall removed exactly what it added, and nothing else")
          PY

      - name: The Codex install survives its plugin root moving
        # Found on a real machine: the hooks file pointed twelve guardrails at a scratch clone in
        # /tmp from a session weeks earlier. Re-installing from the marketplace root did not repair
        # it — the merge matched commands as strings, so a different root read as a different tool,
        # and every guardrail ended up registered twice, one copy of each executing code from a
        # directory with no reason to exist. This is that scenario, both halves of it.
        run: |
          fakehome=$(mktemp -d); fixture=$(mktemp -d)
          rootA=$(mktemp -d)/A; rootB=$(mktemp -d)/B
          git -C "$fixture" init -q
          mkdir -p "$fakehome/.codex"
          # Two third-party hooks, and the second one is the case that matters: it shares a
          # basename with one of ours. Ownership used to be inferred from the path shape with the
          # plugin root wildcarded to `.+`, which `/opt/other-tool/hooks/notify.py` satisfies — so
          # the next install deleted it. The fixture carried only `node /other/tool.mjs`, which
          # shares nothing, so it could not see that.
          third='{"hooks":{"PreToolUse":[{"matcher":"*","hooks":[{"type":"command","command":"node /other/tool.mjs"},{"type":"command","command":"python3 \"/opt/other-tool/hooks/notify.py\""}]}]}}'
          printf '%s\n' "$third" > "$fakehome/.codex/hooks.json"
          cp -r "$PWD" "$rootA"; cp -r "$PWD" "$rootB"
          python3 -c "import json,sys;p=sys.argv[1];d=json.load(open(p));d['version']='0.0.1';json.dump(d,open(p,'w'),indent=2)" \
            "$rootA/.claude-plugin/plugin.json"

          HOME="$fakehome" node "$rootA/codex/install.mjs" --project "$fixture" --plugin "$rootA" > /dev/null
          echo "── version bump from a moved root ──"
          HOME="$fakehome" node "$rootB/codex/install.mjs" --project "$fixture" --plugin "$rootB" > /dev/null
          echo "── same version, moved root, --force (the repair path) ──"
          HOME="$fakehome" node "$rootB/codex/install.mjs" --project "$fixture" --plugin "$rootB" --force > /dev/null
          python3 - "$fakehome" "$rootA" "$rootB" <<'PY'
          import collections, json, re, sys
          home, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
          data = json.load(open(f"{home}/.codex/hooks.json", encoding="utf-8"))
          raw = json.dumps(data)
          assert raw.count(old) == 0, f"{raw.count(old)} command(s) still point at the old plugin root"
          assert raw.count(new) > 0, "no command points at the current plugin root"
          seen = collections.Counter()
          for event, groups in data["hooks"].items():
              for group in groups:
                  for hook in group.get("hooks", []):
                      # Only ours. A third party's file living at the same basename is not a
                      # duplicate of anything — counting it was what made this assertion ambiguous.
                      if new not in hook["command"]:
                          continue
                      for name in re.findall(r"/hooks/([a-z_]+)\.py", hook["command"]):
                          # Keyed by event, because one script answering two different events is
                          # the manifest working as written — the Bash approver runs at both
                          # PreToolUse and PermissionRequest. The defect this guards against is
                          # the same script registered twice for the same event, one copy under a
                          # stale plugin root.
                          seen[(event, name)] += 1
          dupes = {f"{event}:{name}": v for (event, name), v in seen.items() if v > 1}
          assert not dupes, f"a guardrail is registered more than once: {dupes}"
          assert "node /other/tool.mjs" in raw, "a third party's hook was dropped"
          assert "/opt/other-tool/hooks/notify.py" in raw, \
              "a third party's hook sharing a basename with ours was deleted"
          print(f"{len(seen)} registrations, none repeated within an event, "
                "old root gone, third parties intact")
          PY

  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The installer runs under node and under bun
        run: |
          node bin/graph-powers.mjs --help > /dev/null
          bun bin/graph-powers.mjs --help > /dev/null
          node bin/audit-settings.mjs > /dev/null
          echo "installer OK on both runtimes"

      - name: A clone is the artefact — everything it needs is committed
        run: python3 .github/check_clone.py

      - name: Installing from a clone, into an empty machine
        # The path a stranger takes: clone, run the installer, get the Codex artefacts. Claude Code
        # is not on the runner, so this covers the half that does not need it.
        run: |
          clone=$(mktemp -d); fakehome=$(mktemp -d); project=$(mktemp -d)
          git clone --quiet "$PWD" "$clone/graph-powers"
          git -C "$project" init -q
          # The installer refuses to run inside the plugin's own repository, and takes its target
          # from the working directory — so this runs from the project, as a person would.
          cd "$project"
          HOME="$fakehome" node "$clone/graph-powers/bin/graph-powers.mjs" \
            --target codex > /dev/null
          cd - > /dev/null
          test -f "$fakehome/.codex/graph-powers-installed.json" \
            || { echo "::error::a fresh clone did not produce a Codex install"; exit 1; }
          python3 -c "
          import json, sys
          m = json.load(open('$fakehome/.codex/graph-powers-installed.json'))
          assert m['complete'] is True, m
          assert m['pluginRoot'].endswith('graph-powers'), m['pluginRoot']
          print('installed from a clone;', len(m['paths']), 'paths recorded')
          "
